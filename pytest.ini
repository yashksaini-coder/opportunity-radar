[pytest]
# `python -m pytest` puts the working directory on sys.path, but the bare
# `pytest` console script does not — and with no __init__.py under tests/,
# pytest prepends tests/ rather than the project root. So `import radar`
# resolved locally and failed in CI. Put the root on the path explicitly,
# so both invocations behave the same everywhere.
pythonpath = .
testpaths = tests
