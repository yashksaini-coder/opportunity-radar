# Opportunity Radar — scrape targets
#
# Each source is one Scraper Studio collector, created with:
#   brightdata scraper create <url> "<description>"
#
# Paste the returned Collector ID (c_*) into `collector_id` below.
# The `description` here should match what you gave `scraper create` —
# it is reused by the auto-healer to explain the expected schema.
#
# Targets are deliberately server-rendered, low-protection listing pages
# (verified before selection) that Bright Data's pre-built scraper
# library does not cover.

sources:
  - id: mlh-hackathons
    name: MLH — 2027 Season Events
    url: https://www.mlh.com/seasons/2027/events
    collector_id: "c_mt3wn2pz1kpvga867r"
    category: hackathon
    description: >
      Extract hackathon events: title, url, start_date, end_date,
      location, whether in-person or digital.

  - id: scholars4dev-scholarships
    name: Scholars4Dev — International Scholarships
    url: https://www.scholars4dev.com/
    collector_id: "c_mt3wn4dz210wjhjlbd"
    category: scholarship
    description: >
      Extract scholarship listings: title, url, deadline, host country,
      degree level, award or benefits summary.

  - id: python-jobs
    name: Python.org — Job Board
    url: https://www.python.org/jobs/
    collector_id: "c_mt3wn62317q7krz1qx"
    category: job
    description: >
      Extract job postings: title, url, company, location, posted date,
      job types.

# Pipeline health thresholds — a run failing these triggers auto-heal.
health:
  min_rows: 3 # fewer rows than this = suspicious
  max_null_ratio: 0.4 # a required field null in >40% of rows = broken
  required_fields:
    - title
    - url
